<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JNX Fest</title>
    <meta
      name="description"
      content="JNX Fest is returning. Stay tuned for jnxfest 2027 details!"
    >
    <link rel="canonical" href="https://jnxfest.com/">
    <meta property="og:title" content="JNX Fest">
    <meta
      property="og:description"
      content="Stay tuned for jnxfest 2027 details!"
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jnxfest.com/">
    <meta property="og:image" content="https://jnxfest.com/art/jnxfest-handout.jpg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="landing" aria-labelledby="page-title">
      <section class="hero">
        <div class="poster-wrap" aria-label="JNX Fest artwork">
          <img
            class="poster"
            src="art/jnxfest-handout.jpg"
            alt="JNX Fest handout artwork with a purple and black butterfly over a teal and orange background."
          >
        </div>

        <div class="message">
          <p class="eyebrow">Mariposa, California</p>
          <h1 id="page-title">JNX Fest</h1>
          <p class="announcement">Stay tuned for jnxfest 2027 details!</p>
          <p class="supporting">
            A temporary home for future announcements, lineup news, and festival updates.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
